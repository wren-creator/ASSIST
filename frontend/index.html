<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<title>ASSIST</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0f14;
    --panel: #141922;
    --panel-2: #1b2230;
    --line: #263041;
    --text: #dfe6f0;
    --dim: #8a97a8;
    --accent: #5db0ff;
    --ok: #5fce7a;
    --warn: #e0c34a;
    --alert: #ff7a7a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    font: 700 15px/1 var(--mono);
    letter-spacing: 3px;
    margin: 0;
  }
  #status {
    margin-left: auto;
    font: 600 11px/1 var(--mono);
    letter-spacing: 1px;
    color: var(--dim);
  }
  #status.on { color: var(--ok); }
  #status.off { color: var(--alert); }

  #sessions {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .chip {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--dim);
    font: 600 12px/1 var(--mono);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 62px 96px 1fr;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 13px;
  }
  .row:nth-child(even) { background: rgba(255,255,255,0.02); }
  .row .t { color: var(--dim); font: 500 11px/1.4 var(--mono); }
  .row .p { color: var(--accent); font: 600 11px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .s { color: var(--text); word-break: break-word; }
  .row.hook-Notification .s { color: var(--warn); }
  .row.hook-Stop .s { color: var(--ok); }
  .row.hook-SessionStart .s, .row.hook-SessionEnd .s { color: var(--dim); font-style: italic; }

  .bubble {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
  }
  .bubble.you { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); }
  .bubble.assist { align-self: flex-start; background: #123; border: 1px solid #1d3a52; }
  .bubble .lbl { display: block; font: 600 10px/1.4 var(--mono); letter-spacing: 1px; color: var(--dim); margin-bottom: 2px; }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #text {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
  }
  #ptt {
    flex: 0 0 auto;
    width: 64px; height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: 700 11px/1 var(--mono);
    letter-spacing: 1px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #ptt.rec { background: var(--alert); border-color: var(--alert); color: #200; }
  #mute {
    flex: 0 0 auto;
    width: 40px; height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--dim);
    cursor: pointer;
  }
  #mute.off { color: var(--alert); }
</style>
</head>
<body>
<header>
  <h1>ASSIST</h1>
  <span id="status" class="off">connecting</span>
</header>

<div id="sessions"></div>

<main id="feed"></main>

<footer>
  <button id="mute" title="mute spoken replies">&#128266;</button>
  <input id="text" placeholder="ask about your sessions&hellip;  (&ldquo;ask claude &hellip;&rdquo; to escalate)" autocomplete="off">
  <button id="ptt">HOLD</button>
</footer>

<audio id="player" hidden></audio>
<script src="/static/app.js"></script>
</body>
</html>
