<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<title>ASSIST</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0f14;
    --panel: #141922;
    --panel-2: #1b2230;
    --line: #2a3547;
    --text: #e8eef7;
    --dim: #9aa7b8;
    --accent: #63b3ff;
    --ok: #6bd587;
    --warn: #e6cb5a;
    --alert: #ff8585;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body {
    margin: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    height: 100dvh;
    overflow: hidden;            /* the feed scrolls, the shell stays put */
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--sans);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  input, textarea, button, select {
    font-family: inherit;
    font-size: 16px;            /* keeps mobile browsers from zooming on focus */
  }
  button { cursor: pointer; }

  /* ── header ──────────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    margin: 0;
    font: 700 13px/1 var(--mono);
    letter-spacing: 1.5px;
    flex: 0 0 auto;
  }
  #newTaskBtn {
    margin-left: auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 8px;
    padding: 6px 10px;
    font: 600 11px/1 var(--mono);
    letter-spacing: 1px;
    flex: 0 0 auto;
  }
  #quietBtn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 8px;
    padding: 6px 10px;
    font: 600 11px/1 var(--mono);
    letter-spacing: 1px;
    flex: 0 0 auto;
  }
  #quietBtn.on { color: #06121f; background: var(--accent); border-color: var(--accent); }
  #status {
    flex: 0 0 auto;
    font: 600 11px/1 var(--mono);
    letter-spacing: 1px;
    color: var(--dim);
  }
  #status.on  { color: var(--ok); }
  #status.off { color: var(--alert); }

  /* ── new-task panel ──────────────────────────────────────────────────── */
  /* Capped so it can never swallow the feed — it scrolls inside itself. */
  #taskPanel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    max-height: 42vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  #taskName, #taskPrompt {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 11px;
  }
  #taskPrompt { resize: vertical; min-height: 64px; line-height: 1.4; }
  .taskCheck {
    display: flex;
    align-items: center;
    gap: 8px;
    font: 500 13px/1 var(--sans);
    color: var(--dim);
  }
  .taskCheck input { width: 17px; height: 17px; }
  .taskRow { display: flex; gap: 8px; }
  .taskRow button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    font: 600 13px/1 var(--sans);
  }
  #taskStart { background: var(--accent); border-color: var(--accent); color: #06121f; }
  #taskMsg { font: 500 12px/1.4 var(--sans); color: var(--warn); min-height: 1em; }

  /* ── session filter chips ───────────────────────────────────────────── */
  #sessions {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    scrollbar-width: none;
  }
  #sessions::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--dim);
    font: 600 12px/1 var(--mono);
    white-space: nowrap;
  }
  .chip.active { color: #06121f; background: var(--accent); border-color: var(--accent); }

  /* ── feed ───────────────────────────────────────────────────────────── */
  main {
    flex: 1 1 0;
    min-height: 0;               /* let this pane shrink so it can scroll, not grow the page */
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    padding: 8px 10px;
    border-radius: 8px;
    border-left: 3px solid var(--line);
    background: rgba(255,255,255,0.02);
  }
  .row .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .row .t { color: var(--dim); font: 500 11px/1.3 var(--mono); flex: 0 0 auto; }
  .row .p {
    color: var(--accent);
    font: 600 11px/1.3 var(--mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .s {
    color: var(--text);
    font: 400 13px/1.4 var(--sans);
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .row.hook-Notification { border-left-color: var(--warn); }
  .row.hook-Notification .s { color: var(--warn); }
  .row.hook-Stop { border-left-color: var(--ok); }
  .row.hook-Stop .s { color: var(--ok); }
  .row.hook-Task { border-left-color: var(--accent); }
  .row.hook-Operator { border-left-color: var(--accent); }
  .row.hook-SessionStart, .row.hook-SessionEnd { opacity: 0.75; }
  .row.hook-SessionStart .s, .row.hook-SessionEnd .s { font-style: italic; color: var(--dim); }

  .bubble {
    max-width: 90%;
    padding: 9px 12px;
    border-radius: 13px;
    font: 400 14px/1.45 var(--sans);
    overflow-wrap: anywhere;
  }
  .bubble.you    { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); }
  .bubble.assist { align-self: flex-start; background: #10283d; border: 1px solid #1d3a52; }
  .bubble .lbl {
    display: block;
    font: 600 10px/1.4 var(--mono);
    letter-spacing: 1px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  #enableSound {
    align-self: center;
    margin: 6px 0;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--panel-2);
    color: var(--accent);
    font: 600 13px/1 var(--sans);
  }

  /* ── operator approval card ─────────────────────────────────────────── */
  .approval {
    align-self: stretch;
    border: 1px solid var(--warn);
    background: rgba(230, 203, 90, 0.08);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .approval.done {
    opacity: 0.55;
    border-color: var(--line);
    background: rgba(255, 255, 255, 0.02);
  }
  .approval .ahead { display: flex; align-items: baseline; gap: 8px; }
  .approval .albl {
    font: 700 10px/1 var(--mono);
    letter-spacing: 1.5px;
    color: var(--warn);
  }
  .approval .atool { font: 600 13px/1 var(--sans); color: var(--text); }
  .approval .abody {
    font: 400 12px/1.4 var(--mono);
    color: var(--dim);
    overflow-wrap: anywhere;
    word-break: break-word;
    max-height: 40vh;
    overflow-y: auto;
  }
  .approval .arow { display: flex; gap: 8px; }
  .approval .arow button {
    flex: 1;
    border-radius: 10px;
    padding: 10px 14px;
    font: 600 13px/1 var(--sans);
    border: 1px solid var(--line);
  }
  .approval .aallow { background: var(--ok); border-color: var(--ok); color: #06210f; }
  .approval .adeny { background: var(--alert); border-color: var(--alert); color: #200; }
  .approval .astop {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--dim);
    font: 500 11px/1 var(--mono);
    letter-spacing: 1px;
    padding: 2px 0;
    text-decoration: underline;
  }
  .approval button:disabled { opacity: 0.5; }

  /* ── footer input bar ───────────────────────────────────────────────── */
  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    align-items: stretch;
    position: sticky;
    bottom: 0;
  }
  #mute {
    flex: 0 0 auto;
    width: 42px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--dim);
    font-size: 16px;
  }
  #mute.off { color: var(--alert); }
  #text {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
  }
  #ptt {
    flex: 0 0 auto;
    width: 64px;
    min-height: 42px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: 700 12px/1 var(--mono);
    letter-spacing: 1px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #ptt.rec { background: var(--alert); border-color: var(--alert); color: #200; }

  /* ── responsive tiers ───────────────────────────────────────────────── */
  /* Base is sized for a phone. Large phones get a small bump; tablets and
     up get the centered column back with roomier spacing. */
  @media (min-width: 560px) {
    body { font-size: 15px; }
  }
  @media (min-width: 620px) {
    body { max-width: 720px; margin: 0 auto; border-inline: 1px solid var(--line); }
    header { padding: 12px 16px; }
    header h1 { font-size: 15px; letter-spacing: 2px; }
    #newTaskBtn { padding: 8px 12px; font-size: 12px; }
    #taskPanel { max-height: 52vh; padding: 14px 16px; gap: 10px; }
    #taskName, #taskPrompt { padding: 11px 12px; }
    #taskPrompt { min-height: 88px; }
    .taskRow button { padding: 12px 16px; font-size: 14px; }
    #sessions { padding: 10px 12px; }
    .chip { padding: 8px 14px; font-size: 13px; }
    main { padding: 14px; }
    .row .s { font-size: 14px; }
    .bubble { font-size: 15px; padding: 10px 13px; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    #mute { width: 46px; font-size: 18px; }
    #text { padding: 11px 13px; }
    #ptt { width: 76px; min-height: 46px; }
  }
</style>
</head>
<body>
<header>
  <h1>ASSIST</h1>
  <button id="quietBtn" title="showing only what needs you">QUIET</button>
  <button id="newTaskBtn" title="start a project from here">+ task</button>
  <span id="status" class="off">connecting</span>
</header>

<div id="taskPanel" hidden>
  <input id="taskName" placeholder="project name" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label id="taskExisting" class="taskCheck"><input type="checkbox" id="taskExistingCb"> run in an existing project</label>
  <label class="taskCheck"><input type="checkbox" id="taskOperatorCb"> operator mode (approve each step)</label>
  <textarea id="taskPrompt" placeholder="What should Claude build? Be specific."></textarea>
  <div class="taskRow">
    <button id="taskCancel">cancel</button>
    <button id="taskStart">start build</button>
  </div>
  <div id="taskMsg"></div>
</div>

<div id="sessions"></div>

<main id="feed"></main>

<footer>
  <button id="mute" title="mute spoken replies" aria-label="mute">&#128266;</button>
  <input id="text" placeholder="ask about your sessions&hellip;" autocomplete="off">
  <button id="ptt">HOLD</button>
</footer>

<script src="/static/app.js?v=8"></script>
</body>
</html>
