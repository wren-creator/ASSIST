# ASSIST configuration. All local. Nothing here is a secret except that the
# Discord bot token is read separately from ~/.discord/.env (never stored here).

server:
  host: "127.0.0.1"      # loopback only. Use `tailscale serve` for the phone (HTTPS),
                         # or ASSIST_BIND=0.0.0.0 for a trusted home LAN (plain HTTP).
  port: 8787
  event_buffer: 400      # how many recent hook events to keep in memory for the feed + narration
  session_idle_timeout: 1800   # seconds a session can go silent before its chip drops off.
                               # SessionEnd drops it at once; this is the backstop for a missed
                               # SessionEnd. 30 min so a long silent build/test run mid-turn
                               # doesn't vanish (PreToolUse isn't a wired hook, so there's no
                               # event during a long command — an in-progress turn is held by
                               # its UserPromptSubmit until Stop).

# Local model used for narration and "what's it doing" answers. Keep this small —
# on limited RAM, qwen2.5-coder:7b or llama3 are the safe choices, NOT the 14b.
ollama:
  url: "http://localhost:11434/api/chat"
  model: "qwen2.5-coder:7b"
  timeout_seconds: 30
  num_predict: 180        # short spoken answers, keeps latency down

# Speech. stt is always faster-whisper. tts picks the first engine that works:
#   say     -> macOS built-in `say`, zero install, always available (default)
#   kokoro  -> `pip install kokoro`, best quality on Apple Silicon
#   piper   -> `pip install piper-tts`, lighter CPU option
voice:
  stt_model: "base"       # faster-whisper size: tiny / base / small
  tts_engine: "say"
  say_voice: "Oliver (Enhanced)"   # any name from `say -v ?`; en-GB, calm. Download via Spoken Content.
  say_rate: 160           # words per minute for `say`. 0 = system default (~175).
                          # 155-170 reads calmer / more deliberate. Only affects the `say` engine.
  kokoro_voice: "am_michael"
  piper_model: ""         # absolute path to a .onnx voice if tts_engine: piper

# Which hook events get spoken aloud + pushed to Discord vs. just shown in the feed.
announce:
  - Notification          # Claude needs input or permission
  - Stop                  # Claude finished a turn
# Everything else (SessionStart, UserPromptSubmit, PostToolUse, SessionEnd) is feed-only.

# No spoken announcements during these hours (24h local). Feed + Discord still update.
quiet_hours:
  start: 22
  end: 8

# Escalating a spoken question to real Claude (spends Pro budget). Only fires on an
# explicit "ask claude ..." phrasing from the user.
ask_claude:
  enabled: true
  binary: "claude"
  timeout_seconds: 120

# Tier-1 remote tasks: from the phone, name a project + a prompt and ASSIST runs
# a one-shot `claude -p` build for it, no approvals. Spends the Claude
# subscription budget. New folders run with bypassPermissions (nothing there to
# break); existing folders default to acceptEdits.
tasks:
  enabled: true
  projects_root: "~/git"
  timeout_seconds: 900
  max_concurrent: 2
  git_init: true
  new_project_permission_mode: "bypassPermissions"
  existing_project_permission_mode: "acceptEdits"

# Operator mode: one live Claude Code session steered from the phone via the
# Claude Agent SDK. Every edit/command that isn't in auto_approve_tools pauses
# and asks the phone to allow or deny. One session at a time. Spends the Claude
# subscription budget like tasks do.
operator:
  enabled: true
  approval_timeout_seconds: 300     # auto-deny a pending tool call after this long unanswered
  budget_warn_usd: 2.00             # spoken + feed warning the first time spend crosses this
  budget_stop_usd: 5.00            # hard ceiling; the session stops when it hits this
  permission_mode: "default"        # SDK permission mode; "default" routes prompts to the phone
  auto_approve_tools:               # these run without asking (read-only / harmless)
    - Read
    - Glob
    - Grep
    - WebSearch
    - WebFetch
    - TodoWrite

discord:
  enabled: false          # flip to true once channel_id is set
  channel_id: ""          # numeric channel id; `python -m backend.discord_push --list-guilds` helps find it
